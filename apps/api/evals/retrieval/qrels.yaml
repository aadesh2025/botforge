# Retrieval eval relevance judgements — seed set (docs/13 R2, docs/14 P0-2).
#
# `relevance` is graded, not boolean:
#
#   3 = this document answers the question. Anything else at rank 1 is a miss.
#   1 = a customer given this instead would be partly helped, not misled. It is the neighbouring
#       policy, the related page, the one a human agent would send as a follow-up.
#
# The grades are what make NDCG worth more than recall here. Several queries have a near-miss
# sibling that a lexical retriever will rank first (q001/q002 domestic vs international refunds,
# q016 gift card vs store credit, q012 order vs subscription cancellation). Those siblings are
# deliberately graded **0** — absent from this file — because serving them is not a partial
# success, it is a confidently wrong answer about somebody's money.
#
# A separate file rather than a field on the query, so a set generated by
# `scripts/build_retrieval_eval.py` against a real KB drops into the same shape (BEIR's
# corpus/queries/qrels split).
#
# FROZEN. See corpus.yaml.

