# ── exact-identifier queries ─────────────────────────────────────────────────────────────
#
# The half of the threat model q001-q036 could not see. These deliberately DO reuse the
# document's own tokens, because that is how a customer actually writes them: nobody
# paraphrases an order reference. This is where dense retrieval degrades (an embedding of
# `AZ-2026-004417` carries almost no signal) and keyword search is exact, and without them the
# weight sweep was measuring only the case that favours embeddings.

- id: q037
  text: "my order AZ-2026-004417 still hasn't shipped"
  note: "exact identifier; an embedding of a reference number carries almost no signal"

- id: q038
