# Retrieval eval queries — seed set (docs/13 R2, docs/14 P0-2).
#
# Written the way the recipe asks for them: how a customer would actually type the question,
# in their own words, NOT in the document's phrasing, under 20 words. Where a document says
# "carriage", the query says "who pays to post it back"; where it says "showroom opening
# hours", the query says "what time do you shut on saturday".
#
# That vocabulary gap is the point. A query that reuses the document's own nouns is answered by
# the keyword half alone and tells you nothing about whether retrieval works — it measures
# string matching. Several of these are answerable ONLY by meaning.
#
# FROZEN alongside corpus.yaml. Regenerating or rewording makes every recorded number
# non-comparable; that is the one warning docs/13 R2 puts in bold.

- id: q001
  text: "ordered a kurta to delhi last week and it doesn't suit me, how long have i got"
  note: "near-miss: refunds-international shares almost all of its vocabulary"

