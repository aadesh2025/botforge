[project]
name = "botforge-api"
version = "0.1.0"
description = "BotForge API — FastAPI backend for the AI chatbot & automation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Main-content extraction for URL ingest: strips nav/header/footer/cookie-banner
    # boilerplate that a regex tag-strip would fold into the article text.
    "trafilatura>=1.12",
    "sentry-sdk[fastapi]>=2.0",
    # Async SMTP: the stdlib `smtplib` is blocking and would stall the event loop on
    # every send. One SMTP client covers every relay (Resend/Postmark/SendGrid/SES/...).
    "aiosmtplib>=3.0",
    # PII egress detection (docs/11 Phase B). Google's libphonenumber metadata, so a number
    # is validated against the real numbering plan of its country rather than a regex guess.
    # The leak that prompted this was an Indian mobile; a US-centric pattern misses it, and a
    # permissive one redacts order numbers and prices out of ordinary replies. See ADR-053.
    "phonenumbers>=8.13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: keep long DDL lines as generated.
"migrations/versions/*" = ["E501"]
# The homoglyph-folding table and its tests are *made of* ambiguous Unicode — Cyrillic and
# Greek lookalikes are the input the module exists to defang (docs/11 §4-L0). RUF001/2/3
# flagging them is the linter working correctly on code where the finding does not apply.
"app/chat/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_guardrails_redteam.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are the intended idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
