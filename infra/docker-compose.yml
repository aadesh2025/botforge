# BotForge — dev stack. Bring the whole platform up with: docker compose up
# Config comes from ../.env (copy ../.env.example first). Service URLs below are
# overridden for in-network addressing.
name: botforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botforge}
      POSTGRES_DB: ${POSTGRES_DB:-botforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:-botforge}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
      N8N_BASE_URL: http://n8n:5678
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Phase 1 will prepend: alembic upgrade head &&
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:-botforge}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Celery worker: runs document-ingestion (RAG) and later background jobs (Phase 7+).
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:-botforge}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      redis:
        condition: service_healthy
    # Celery beat: fires periodic jobs (the webhook retry sweep — see celery_app.beat_schedule).
    command: celery -A app.worker.celery_app beat --loglevel=info

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-botforge}
      GENERIC_TIMEZONE: UTC
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  n8ndata:
  ollamadata:
  api_venv:
  web_node_modules:
